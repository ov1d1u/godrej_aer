update_status:
  name: Update status
  description: >-
    Connect to the Godrej Aer Smart Matic device and refresh its status
    (battery voltage and connection state). Bypasses the automatic retry
    cooldown. If no target is given, every configured device is updated.
  target:
    device:
      integration: godrej_aer
    entity:
      integration: godrej_aer
